# v* 태그를 올리면 Windows x64 실행 파일을 빌드해 GitHub 릴리스로 올린다.
# 릴리스 설명은 태그 메시지(git tag -a … --cleanup=verbatim)를 그대로 쓴다.
# 자산 이름은 앱의 업데이트 확인(src/update.rs)이 찾는 이름과 같아야 한다:
#   GhostDesk-<버전>-windows-x64.exe, SHA256SUMS.txt
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 의 버전을 rustup 이 받아 쓴다
      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "태그 $version 과 Cargo.toml 버전 $cargo 이 다릅니다" }
          $name = "GhostDesk-$version-windows-x64.exe"
          Copy-Item target/release/ghostdesk.exe $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("SHA256SUMS.txt", "$hash  $name`n")
          "ASSET=$name" >> $env:GITHUB_ENV

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ASSET" SHA256SUMS.txt --verify-tag --notes-from-tag --title "GhostDesk ${{ github.ref_name }} (Windows x64)"
