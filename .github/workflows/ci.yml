# push·PR 마다 Windows 와 macOS 에서 빌드하고 단위 테스트를 돌린다.
# (macOS 에서 개발하면 Windows 전용 코드가 컴파일되는지 볼 수 없어서 — 반대도 마찬가지)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 의 버전을 rustup 이 받아 쓴다
      - name: Build
        run: cargo build --locked

      # 실패하면 실패한 테스트와 panic 문구를 오류 주석으로 남긴다
      # (공개 저장소의 실행 로그는 로그인해야 보이지만 주석은 누구나 볼 수 있다)
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --locked 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^test .* FAILED$" test.log | head -20 | while read -r line; do echo "::error::$line"; done
            # panic 줄과 그 아래 메시지 두 줄을 한 줄로
            awk '/panicked at/ {msg=$0; for (i = 0; i < 2 && (getline nxt) > 0; i++) msg = msg " | " nxt; print msg}' test.log \
              | head -10 | while read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit "$status"
